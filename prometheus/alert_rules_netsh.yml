  #     - alert: TCP listener gone
  #       # 0
  #       expr: |
  #         sum without (container) (
  #           docker_netns_tcp_state{state="LISTEN"} offset 1h
  #         ) > 0
  #         unless
  #         sum without (container) (docker_netns_tcp_state{state="LISTEN"})
  #       for: 15m
  #       labels:
  #         severity: info
  #       annotations:
  #         summary: "Сервис не слушает ни одного порта (service {{ $labels.service }})"
  #         description: "Час назад у {{ $labels.service }} на {{ $labels.instance }} были слушающие сокеты, сейчас нет — процесс упал или не поднялся после рестарта"
  #         description_short: "{{ $labels.service }} не слушает ни одного порта"
  #         value: "{{ $value | printf \"%.0f\" }}"
  #         labels: "{{ $labels }}"